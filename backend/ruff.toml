# The production image runs Python 3.12 - lint for that, not for whatever
# the developer's laptop happens to have.
target-version = "py312"
line-length = 110

[lint]
# Ruff's defaults (pyflakes + the error-level pycodestyle checks): unused
# imports, undefined names, unused variables. Deliberately not a style
# overhaul - the point is catching mistakes, not reformatting the codebase.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Generated by Alembic; reviewed when written, not worth linting forever.
"alembic/versions/*" = ["F401", "E501"]
