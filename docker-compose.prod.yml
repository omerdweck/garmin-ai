# Production stack. Run with:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# A separate file rather than an override of docker-compose.yml, because
# the differences are removals (bind mounts, published ports, --reload)
# and Compose overrides can only add to those keys, never take them away.
#
# What differs from the development file, and why:
#   - no bind mount of ./backend: the image carries the code, so what runs
#     is exactly what was built and can't drift with whatever happens to be
#     on the server's disk
#   - no --reload: a file watcher restarting the app in production turns a
#     half-finished deploy into an outage
#   - the API binds to 127.0.0.1 only: it's reachable from the server
#     itself for health checks, and from nowhere else. The website is
#     paused, so nothing needs it from outside
#   - db and redis publish nothing at all, same as in development

services:
  api:
    restart: unless-stopped
    build: ./backend
    # 127.0.0.1 prefix is the whole point - "8000:8000" would bind 0.0.0.0
    # and put the API on the public internet.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    restart: unless-stopped
    build: ./backend
    env_file:
      - .env
    depends_on:
      - db
      - redis
    # Four processes on a 2-vCPU server, on purpose: the work is waiting on
    # Garmin and Claude over the network, not computing, so more processes
    # than cores keeps them busy. Celery's default (one per core) left a
    # 15-minute backfill holding half the capacity. ~100MB RAM each.
    # Default queue only: syncs and the hourly dispatchers. Anything that
    # waits on Claude runs in worker_coach below, so it can never hold
    # these up.
    command: celery -A app.celery_app worker -Q celery --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}

  worker_coach:
    restart: unless-stopped
    build: ./backend
    env_file:
      - .env
    depends_on:
      - db
      - redis
    # The AI queue: summaries and the coach's own messages. Two processes -
    # each call is mostly waiting on Claude, and the monthly budget, not
    # this number, is what limits how much of it happens.
    command: celery -A app.celery_app worker -Q coach -n coach@%h --loglevel=info --concurrency=${CELERY_COACH_CONCURRENCY:-2}

  beat:
    restart: unless-stopped
    build: ./backend
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A app.celery_app beat --loglevel=info

  bot:
    restart: unless-stopped
    build: ./backend
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: python -m app.bot

  # The Mini App's API - its own process (app/webapp.py), not the api
  # service above. Publishes no port: only Caddy reaches it, over the
  # compose network. Connects as miniapp_ro, a role that can only read and
  # can't see passwords, Garmin tokens or coach conversations at all; these
  # two lines override the owner credentials that come in from .env.
  webapp:
    restart: unless-stopped
    build: ./backend
    env_file:
      - .env
    environment:
      POSTGRES_USER: miniapp_ro
      POSTGRES_PASSWORD: ${MINIAPP_DB_PASSWORD:?set MINIAPP_DB_PASSWORD in .env - see the miniapp_readonly migration}
    depends_on:
      - db
      - redis
    command: uvicorn app.webapp:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"

  # The only service listening on the public internet: HTTPS for the Mini
  # App. Gets and renews its own Let's Encrypt certificate, which is why
  # port 80 must be open too (that's where Let's Encrypt checks the domain).
  caddy:
    restart: unless-stopped
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      MINIAPP_DOMAIN: ${MINIAPP_DOMAIN:-garmin-ai.duckdns.org}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Static files rather than code: the built page, served as-is.
      - ./miniapp:/srv/miniapp:ro
      # Certificates live here. Losing this volume means asking Let's
      # Encrypt again on every restart, and its weekly limits are real.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webapp

  db:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - garmin_ai_pgdata:/var/lib/postgresql/data
    # Health data - worth knowing the DB is actually accepting connections
    # before the app services start hammering it on boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7

volumes:
  garmin_ai_pgdata:
  caddy_data:
  caddy_config:
