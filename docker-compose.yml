services:
  api:
    restart: unless-stopped
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code  # enables live reload during development without rebuilding; also lets alembic.ini/alembic/ live at the backend root and sync back to the host
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    restart: unless-stopped
    build: ./backend
    volumes:
      - ./backend:/code
    env_file:
      - .env
    depends_on:
      - db
      - redis
    # Four processes on a 2-vCPU server, on purpose: the work is waiting on
    # Garmin and Claude over the network, not computing, so more processes
    # than cores keeps them busy. Celery's default (one per core) left a
    # 15-minute backfill holding half the capacity. ~100MB RAM each.
    command: celery -A app.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}

  beat:
    restart: unless-stopped
    build: ./backend
    volumes:
      - ./backend:/code
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A app.celery_app beat --loglevel=info

  bot:
    restart: unless-stopped
    build: ./backend
    volumes:
      - ./backend:/code
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: python -m app.bot

  # Neither db nor redis publishes a port on purpose. The app services
  # reach them over Docker's internal network by service name (`db`,
  # `redis`), so a published port adds nothing they need - it only adds a
  # second way in from outside the host. On a laptop "outside" is the home
  # network; on a public server it's the whole internet, and a database
  # holding other people's health data has no business being reachable
  # from there.
  #
  # Note this can't be delegated to a firewall: Docker writes iptables
  # rules directly and a published port bypasses ufw, so not publishing it
  # is the actual control.
  #
  # `docker compose exec db psql ...` still works - exec runs inside the
  # container and never touches a published port.
  db:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - garmin_ai_pgdata:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    image: redis:7

  # --- Tests -----------------------------------------------------------
  # Run with:  docker compose --profile test run --rm tests
  #
  # The `test` profile keeps both services out of a plain `docker compose
  # up`. They are isolated from the real stack on purpose: a separate
  # throwaway Postgres (tmpfs - it lives in memory and vanishes with the
  # container), and no env_file, so the tests never see a real secret or the
  # real database. conftest.py additionally refuses any database whose name
  # does not end in _test.
  db_test:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: garmin_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis_test:
    profiles: ["test"]
    image: redis:7

  tests:
    profiles: ["test"]
    build: ./backend
    volumes:
      - ./backend:/code
    environment:
      POSTGRES_HOST: db_test
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: garmin_test
      REDIS_HOST: redis_test
      REDIS_PORT: "6379"
    depends_on:
      db_test:
        condition: service_healthy
      redis_test:
        condition: service_started
    command: sh -c "pip install -q -r requirements-dev.txt && ruff check . && pytest"

volumes:
  garmin_ai_pgdata:
