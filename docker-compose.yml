services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code  # enables live reload during development without rebuilding; also lets alembic.ini/alembic/ live at the backend root and sync back to the host
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    volumes:
      - ./backend:/code
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A app.celery_app worker --loglevel=info

  beat:
    build: ./backend
    volumes:
      - ./backend:/code
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: celery -A app.celery_app beat --loglevel=info

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - garmin_ai_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  garmin_ai_pgdata:
