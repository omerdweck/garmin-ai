<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>הדשבורד</title>
  <!-- Telegram's own script: injects window.Telegram.WebApp with initData and theme. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f7f4ee);
      --text: var(--tg-theme-text-color, #1d1d1b);
      --hint: var(--tg-theme-hint-color, #8a877f);
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { text-align: center; padding: 24px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 2.2rem; margin: 0 0 8px; }
    p { color: var(--hint); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">…</h1>
    <p id="sub"></p>
  </main>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    const title = document.getElementById("title");
    const sub = document.getElementById("sub");

    async function start() {
      if (!tg || !tg.initData) {
        title.textContent = "פתח אותי מתוך הבוט";
        sub.textContent = "הדשבורד עובד רק מתוך טלגרם.";
        return;
      }
      tg.ready();
      tg.expand();
      try {
        const res = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: tg.initData }),
        });
        if (res.status === 403) {
          title.textContent = "עוד לא מחובר";
          sub.textContent = "פתח את הבוט וחבר את Garmin.";
          return;
        }
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        title.textContent = `שלום ${data.first_name || ""}`.trim();
        sub.textContent = data.garmin_linked ? "Garmin מחובר. הדשבורד בדרך." : "פתח את הבוט וחבר את Garmin.";
      } catch (e) {
        title.textContent = "משהו השתבש";
        sub.textContent = "נסה לסגור ולפתוח שוב.";
      }
    }
    start();
  </script>
</body>
</html>
